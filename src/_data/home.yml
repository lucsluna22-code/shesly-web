veo:
  etiqueta: La formación
  titulo_linea1: Lo que vas a
  titulo_destacado: desarrollar.
  bajada: 'Cinco capacidades, con ejercicios prácticos para integrarlas en tu vida cotidiana. No es un temario para leer: es entrenamiento.'
  capacidades:
    - numero: '01'
      titulo: Intuición
      texto: Desarrolla tu capacidad de percibir más allá de lo evidente y de confiar en tu sabiduría interna.
    - numero: '02'
      titulo: Percepción
      texto: Afina tu observación para comprender lo que otros no ven y tomar mejores decisiones.
    - numero: '03'
      titulo: Confianza
      texto: Fortalece tu seguridad interna y actúa desde la certeza, incluso en medio de la incertidumbre.
    - numero: '04'
      titulo: Enfoque
      texto: Entrena tu mente para sostener la atención en lo esencial y multiplicar tu claridad.
    - numero: '05'
      titulo: Autoconocimiento
      texto: Profundiza en tu identidad, tus valores y tu propósito, para vivir con coherencia y dirección.
  incluye_titulo: Y además
  incluye:
    - Sesiones grupales, divertidas y expansivas, para generar comunidad y conexión.
    - El manual de la formación y la carpeta con el material para imprimir.
    - Grupo de WhatsApp del curso, para las dudas entre una sesión y la otra.
    - Ejercicios guiados con hojas de colores, tarjetas y revistas.
  boton: Ver fechas y precios
  boton_url: /#reservar

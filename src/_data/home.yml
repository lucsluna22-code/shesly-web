# ── Paso 3 del recorrido: se reconoce en el problema ──
si_te_pasa:
  etiqueta: "¿Es para ti?"
  titulo_linea1: "Si te pasa esto,"
  titulo_destacado: "sigue"
  titulo_linea2: "leyendo."
  items:
    - "Sientes cosas antes de que pasen y no sabes cómo explicarlo."
    - "Llegaste a Jacobo Grinberg por tu cuenta y te quedaste con ganas de más."
    - "Leíste mucho sobre percepción y consciencia, pero nunca lo practicaste con alguien que te guíe."
    - "Estás en un camino espiritual y quieres algo concreto, no otra teoría."
    - "Quieres leer la energía de una situación y redirigir aquello que no te beneficia."
  cierre_frase: "\"Si tienes un cuerpo y una mente, es para ti. Y si sientes el llamado a experimentar, también.\""
  cierre_autor: "Shesly"


# ── Paso 5 del recorrido: entiende qué puede comprar ──
veo:
  etiqueta: "La formación"
  titulo_linea1: "Lo que vas a"
  titulo_destacado: "desarrollar."
  bajada: "Cinco capacidades, con ejercicios prácticos para integrarlas en tu vida cotidiana. No es un temario para leer: es entrenamiento."
  capacidades:
    - numero: "01"
      titulo: "Intuición"
      texto: "Desarrolla tu capacidad de percibir más allá de lo evidente y de confiar en tu sabiduría interna."
    - numero: "02"
      titulo: "Percepción"
      texto: "Afina tu observación para comprender lo que otros no ven y tomar mejores decisiones."
    - numero: "03"
      titulo: "Confianza"
      texto: "Fortalece tu seguridad interna y actúa desde la certeza, incluso en medio de la incertidumbre."
    - numero: "04"
      titulo: "Enfoque"
      texto: "Entrena tu mente para sostener la atención en lo esencial y multiplicar tu claridad."
    - numero: "05"
      titulo: "Autoconocimiento"
      texto: "Profundiza en tu identidad, tus valores y tu propósito, para vivir con coherencia y dirección."
  incluye_titulo: "Y además"
  incluye:
    - "Sesiones grupales, divertidas y expansivas, para generar comunidad y conexión."
    - "El manual de la formación y la carpeta con el material para imprimir."
    - "Grupo de WhatsApp del curso, para las dudas entre una sesión y la otra."
    - "Ejercicios guiados con hojas de colores, tarjetas y revistas."
  boton: "Ver fechas y precios"
  boton_url: "/#reservar"

sobre_mi:
  imagen: "/assets/img/retrato-3.jpg"
  imagen_alt: "Shesly Gutierrez, facilitadora de Visión Extraocular"
  etiqueta: "Quién te va a acompañar"
  titulo_linea1: "Soy"
  titulo_destacado: "Shesly"
  titulo_linea2: "Gutiérrez."
  titulo_linea3: ""
  frase: "\"Mi propósito es ser el puente entre tu conciencia y la sabiduría infinita que reside en ti.\""
  parrafos:
    - "Desde niña hacía más preguntas de las que \"debería\". En lugar de dejar de preguntar, decidí explorar: la ciencia, la espiritualidad, distintas corrientes de pensamiento, escuelas religiosas, todo lo que pudiera ayudarme a entender quién era y qué era capaz de experimentar."
    - "Mi camino no siempre fue sencillo. Atravesé crisis y etapas en las que llegué a cuestionarme profundamente la vida y a mí misma. Cada una de esas experiencias me llevó a seguir buscando, y aun así seguía sintiendo que faltaba algo. Así que exploré también lo que pocas personas se atreven a cuestionar: la percepción, la intuición y las capacidades que nuestro cuerpo puede desarrollar."
    - "Esa búsqueda me llevó a entrenarme en Visión Extraocular, y con el tiempo entendí que no tenía que elegir entre ciencia y espiritualidad: para mí se encuentran en un mismo lugar, en la experiencia de nuestro propio cuerpo. De ahí nació Visión Cuántica, mi academia de Visión Extraocular."
    - "Llevo diez años recorriendo este camino. Hoy comparto lo que viví, estudié y sigo descubriendo, de una manera simple, amorosa y divertida. Y quizá, como me pasó a mí, descubras que muchas de las respuestas que llevabas años buscando afuera siempre estuvieron dentro de ti."
  insignias:
    - icono: "👁️"
      titulo: "VEO"
      subtitulo: "Visión Extraocular"
      color: "blue"
    - icono: "🧭"
      titulo: "10 años"
      subtitulo: "En este camino"
      color: "purple"
    - icono: "✨"
      titulo: "Visión Cuántica"
      subtitulo: "Su academia"
      color: "rose"


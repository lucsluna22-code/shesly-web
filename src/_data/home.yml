# ── Paso 6 del recorrido: resuelve la última duda ──
preguntas:
  etiqueta: "Antes de decidir"
  titulo_linea1: "Preguntas"
  titulo_destacado: "frecuentes"
  lista:
    - pregunta: "¿Tiene efectos adversos?"
      respuesta: "No. VEO potencia una habilidad que ya tienes, y en clase te doy las herramientas para aprender a usarla."
    - pregunta: "¿Desde qué sesión puedo ver?"
      respuesta: "Depende de la apertura y la energía de cada persona. Algunas perciben color en la primera clase; otras necesitan más práctica. Por eso el trabajo es semanal y acompañado."
    - pregunta: "¿Para qué edades es?"
      respuesta: "Para todas."
    - pregunta: "¿Cómo sé si es para mí?"
      respuesta: "Si tienes un cuerpo y una mente, es para ti. Y si sientes el llamado a experimentar, también."
    - pregunta: "No tengo tiempo."
      respuesta: "Son cinco encuentros, uno por semana, y eliges entre viernes a las 18:00 o sábado a las 10:00 (hora CDMX). Si quieres probar antes de comprometerte con el programa completo, hay una sesión suelta por $49 USD."
    - pregunta: "No creo en estas cosas."
      respuesta: "Si crees en el wifi, también puedes descubrir la información de la energía. No me creas: experiméntalo."
    - pregunta: "¿Qué recibo después de pagar?"
      respuesta: "Un mensaje de bienvenida, el PDF con la hoja de ruta y los términos, el acceso al grupo de WhatsApp, la carpeta de Drive con el material para imprimir y el manual."
    - pregunta: "¿Puedo pagar en pesos mexicanos?"
      respuesta: "Sí. La sesión suelta son $888 MXN y el programa completo $3,456 MXN. El cobro con tarjeta se procesa en dólares, así que tu banco hace la conversión."

